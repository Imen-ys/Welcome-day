<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What happens to your name?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen font-mono">
  <div class="max-w-7xl mx-auto p-4 md:p-6">

    <header class="mb-4">
      <h1 class="text-xl md:text-2xl font-bold text-white">What happens to your name when you submit a form?</h1>
      <p class="text-sm text-slate-400">Type a name, then follow it from your browser to the database and back. Click any 3D node to learn about it.</p>
    </header>

    <main class="grid lg:grid-cols-3 gap-4">

      <!-- 3D area -->
      <section class="lg:col-span-2 relative rounded-xl border border-slate-800 bg-slate-900 overflow-hidden">
        <div id="scene" class="w-full h-[460px] lg:h-[680px]"></div>
        <div class="absolute bottom-4 left-4 flex gap-2">
          <button id="next-btn" class="hidden px-4 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold hover:bg-cyan-400 disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-cyan-300">Next step</button>
          <button id="reset-btn" class="hidden px-4 py-2 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400">Try another name</button>
        </div>
      </section>

      <aside class="space-y-4">

        <!-- 1. The form the visitor fills in -->
        <form id="name-form" class="rounded-xl border border-slate-800 bg-slate-900 p-4">
          <label for="name-input" class="block text-sm font-bold text-white">Your name</label>
          <input id="name-input" type="text" autocomplete="off" placeholder="e.g. Sara"
            class="mt-2 w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400" />
          <p id="form-error" class="mt-1 text-xs text-rose-400 min-h-[1rem]"></p>
          <button id="start-btn" type="submit" class="mt-2 w-full px-4 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold hover:bg-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-300">Start Simulation</button>
        </form>

        <!-- 2. Current step (filled by main.js) -->
        <div id="step-card" class="hidden rounded-xl border border-slate-800 bg-slate-900 p-4">
          <div class="flex items-center justify-between text-xs text-slate-400">
            <span id="step-count"></span>
            <span id="step-badge" class="hidden rounded bg-rose-500/20 text-rose-300 px-2 py-0.5">Security step</span>
          </div>
          <div class="mt-2 h-1 rounded bg-slate-800"><div id="progress-bar" class="h-1 rounded bg-cyan-400 transition-all" style="width:0%"></div></div>
          <h2 id="step-title" class="mt-3 text-base font-bold text-white"></h2>
          <p id="step-desc" class="mt-1 text-sm text-slate-400 leading-relaxed"></p>
          <pre id="step-code" class="mt-3 rounded-lg bg-slate-950 border border-slate-800 p-3 text-xs text-amber-200 whitespace-pre-wrap overflow-x-auto"></pre>
        </div>

        <!-- 3. Info about the clicked node -->
        <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
          <h2 id="info-title" class="text-sm font-bold text-white"></h2>
          <p id="info-text" class="mt-1 text-sm text-slate-400 leading-relaxed"></p>
        </div>
      </aside>
    </main>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
